name: Deploy to gh-pages (project site)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node (for potential future tooling)
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Deploy 3_Marketing_Landing to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: 3_Marketing_Landing
          publish_branch: gh-pages
          force_orphan: true
